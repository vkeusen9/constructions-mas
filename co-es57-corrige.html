<style>
:root{--cy:#0099b8;--ink:#222}
*{box-sizing:border-box}

.wrap{max-width:1500px;margin:0 auto;padding:8px 16px 10px}
h1{margin:0 0 6px;font-size:30px;color:var(--cy);border-bottom:3px solid var(--cy);padding-bottom:4px}

.lst{flex:none;width:370px;font-size:22px;line-height:1.35}

 <h1><small>ES57</small>Histoire de se mettre d’accord</h1>
 <div class="nav">

  <div class="lst">
   <p>Dans ce triangle <i>ABC</i>, on a tracé ou représenté :</p>
   <div class="it" id="i0">a) deux médianes,<span class="an" id="a0"></span></div>
   <div class="it" id="i1">b) une bissectrice,<span class="an" id="a1"></span></div>
   <div class="it" id="i2">c) un segment moyen,<span class="an" id="a2"></span></div>
   <div class="it" id="i3">d) l’orthocentre,<span class="an" id="a3"></span></div>
   <div class="it" id="i4">e) une médiatrice,<span class="an" id="a4"></span></div>
   <div class="it" id="i5">f) deux hauteurs,<span class="an" id="a5"></span></div>
   <div class="it" id="i6">g) le centre de gravité.<span class="an" id="a6"></span></div>

{ /* b) une bissectrice */
  const rA=ring(A,RED),l=line(A,S2,RED),a1=arcSmall(A,B,S2,48,RED),a2=arcSmall(A,S2,C,48,RED);
  E[1]={def:'<b>Bissectrice d’un triangle</b> : droite issue d’<span class="hl" data-k="som">un sommet</span> qui partage l’angle <span class="hl" data-k="ang">en deux angles isométriques</span>.',
    ans:`<span class="pa" data-k="0" style="color:${RED}">AS</span>`,
    ev:[[300,'hl','som'],[300,'f',rA],[1100,'d',l,1000],[2400,'hl','ang'],[2400,'f',a1],[2400,'f',a2],[3500,'p',0]],end:3500};
}
{ /* c) un segment moyen */
  const mP=midMark(A,B,GRN),mT=midMark(B,C,GRN),l=line(P,T,GRN);
  E[2]={def:'<b>Segment moyen d’un triangle</b> : segment qui relie <span class="hl" data-k="mid">les milieux de deux côtés</span>.',
    ans:`<span class="pa" data-k="0" style="color:${GRN}">PT</span>`,
    ev:[[300,'hl','mid'],[300,'f',mP],[1100,'f',mT],[1900,'d',l,900],[2800,'p',0]],end:3100};
}
{ /* d) l'orthocentre */
  const l1=line(A,R,C1),l2=line(C,Q,C2);
  const r1=rightAng(R,sub(R,C),sub(R,A),C1),r2=rightAng(Q,sub(Q,B),sub(Q,C),C2);
  const rx=ring(X,MAG,14),px=pointM(X,MAG);
  E[3]={def:'<b>Orthocentre d’un triangle</b> : <span class="hl" data-k="pt">point d’intersection</span> <span class="hl" data-k="h">des trois hauteurs</span>.',
    ans:`<span class="pa" data-k="0" style="color:${MAG}">X</span>`,
    ev:[[300,'hl','h'],[300,'d',l1,900],[1300,'f',r1],[1500,'d',l2,900],[2500,'f',r2],[3000,'hl','pt'],[3000,'f',rx],[3000,'f',px],[3400,'p',0]],end:4000};
}
{ /* e) une médiatrice */
  const mT=midMark(B,C,TEAL),l=line(U1,U2,TEAL),r=rightAng(T,sub(T,C),sub(T,U1),TEAL);
  E[4]={def:'<b>Médiatrice d’un côté d’un triangle</b> : droite <span class="hl" data-k="perp">perpendiculaire à ce côté</span> passant par <span class="hl" data-k="mid">son milieu</span>.',
    ans:`<span class="pa" data-k="0" style="color:${TEAL}">TU</span>`,
    ev:[[300,'hl','mid'],[300,'f',mT],[1300,'hl','perp'],[1300,'d',l,1100],[2500,'f',r],[3000,'p',0]],end:3500};
}
{ /* f) deux hauteurs */
  const rA=ring(A,C1),l1=line(A,R,C1),r1=rightAng(R,sub(R,C),sub(R,A),C1);
  const rC=ring(C,C2),l2=line(C,Q,C2),r2=rightAng(Q,sub(Q,B),sub(Q,C),C2);
  E[5]={def:'<b>Hauteur d’un triangle</b> : droite issue d’<span class="hl" data-k="som">un sommet</span> <span class="hl" data-k="perp">perpendiculaire au côté opposé</span>.',
    ans:`<span class="pa" data-k="0" style="color:${C1}">AR</span><span class="pa" data-k="1"> et <span style="color:${C2}">CQ</span></span>`,
    ev:[[300,'hl','som'],[300,'f',rA],[1100,'hl','perp'],[1100,'d',l1,900],[1100,'p',0],[2100,'f',r1],[2800,'f',rC],[3300,'d',l2,900],[3300,'p',1],[4300,'f',r2]],end:5200};
}
{ /* g) le centre de gravité */
  const l1=line(A,T,C1),l2=line(C,P,C2),rx=ring(V,MAG,14),px=pointM(V,MAG);
  E[6]={def:'<b>Centre de gravité d’un triangle</b> : <span class="hl" data-k="pt">point d’intersection</span> <span class="hl" data-k="med">des trois médianes</span>.',
    ans:`<span class="pa" data-k="0" style="color:${MAG}">V</span>`,
    ev:[[300,'hl','med'],[300,'d',l1,900],[1400,'d',l2,900],[2700,'hl','pt'],[2700,'f',rx],[2700,'f',px],[3100,'p',0]],end:3800};
}
function setHL(keys){document.querySelectorAll(".hl").forEach(h=>h.classList.toggle("on",keys.has(h.dataset.k)))}
let cur=0;
function render(s,anim){
  cancel();
  all.forEach(e=>{e.style.transition="none";e.style.opacity=0;e.style.strokeDasharray=""});
  for(let i=0;i<7;i++){const a=$("a"+i);a.innerHTML=i<s?E[i].ans:"";if(i<s-1)a.querySelectorAll(".pa").forEach(p=>p.classList.add("on"));$("i"+i).classList.toggle("cur",i===s-1)}
  if(s===0){$("def").innerHTML="";setHL(new Set())}
  else{
    const it=E[s-1];$("def").innerHTML=it.def;
    const keys=new Set();
    if(!anim){it.ev.forEach(e=>{if(e[1]==='hl')keys.add(e[2]);else if(e[1]==='f')fade(e[2],false);else if(e[1]==='d')draw(e[2],false)});setHL(keys);
      $("a"+(s-1)).querySelectorAll(".pa").forEach(p=>p.classList.add("on"))}
    else{
      setHL(keys);
      it.ev.forEach(([t,k,x,dur])=>{
        if(k==='hl')at(t,()=>{keys.add(x);setHL(keys)});
        else if(k==='f')fade(x,true,500,t);
        else if(k==='p')at(t,()=>{const q=$("a"+(s-1)).querySelector(`.pa[data-k="${x}"]`);if(q)q.classList.add("on")});
        else draw(x,true,dur,t);
      });
    }
  }
  cur=s;
  $("dots").innerHTML=Array.from({length:8},(_,i)=>`<i class="${i<=s?"on":""} ${i===s?"cur":""}"></i>`).join("");
  $("bPrev").style.visibility=s===0?"hidden":"visible";
  $("bNext").style.visibility=s===7?"hidden":"visible";
}
const next=()=>{if(cur<7)render(cur+1,true)};
const prev=()=>{if(cur>0)render(cur-1,false)};
$("bNext").onclick=e=>{e.stopPropagation();next()};
$("bPrev").onclick=e=>{e.stopPropagation();prev()};
$("fig").onclick=next;
document.addEventListener("keydown",e=>{
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();next()}
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev()}
});
render(0,false);
</script>
</body>
</html>
