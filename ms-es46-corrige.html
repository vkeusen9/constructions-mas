<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ES46_corrigé</title>
<style>
:root{--ink:#222;--cy:#0099b8;--or:#e07b00;--pu:#7a3bbf;--re:#d6232a;--gr:#1a9a55}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:18px 20px 40px}
h1{font-size:28px;margin:0 0 4px;color:var(--cy);border-bottom:3px solid var(--cy);padding-bottom:4px}
h1 small{font-size:15px;color:#555;font-weight:400;margin-left:10px}
.bar{display:flex;gap:10px;margin:14px 0}
button{font:inherit;font-weight:600;padding:8px 20px;border-radius:8px;border:2px solid var(--cy);background:#e8f6fa;color:#005f73;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.consigne{background:#f4f9fb;border-left:5px solid var(--cy);padding:10px 14px;border-radius:6px;margin-bottom:14px;line-height:1.5}
.row{display:grid;grid-template-columns:230px 1.2fr 1fr;gap:14px;align-items:center;border:2px solid #d9e3e8;border-radius:12px;padding:12px 14px;margin-bottom:12px;opacity:.35;transition:opacity .5s,border-color .5s,background .5s}
.row.on{opacity:1}
.row.nofig{grid-template-columns:230px 1fr}
.row.ok.done{border-color:var(--gr);background:#f0faf4}
.row.ko.done{border-color:var(--re);background:#fdf1f1}
.t{font-weight:700;font-size:18px;margin-bottom:4px}
.d{font-size:17px}
.d b{font-weight:700}
svg{width:100%;height:auto;display:block}
.just{font-size:16px;line-height:1.5;min-height:60px}
.just .line{opacity:0;transform:translateY(4px);transition:opacity .8s,transform .8s}
.just .line.on{opacity:1;transform:none}
.verdict{font-weight:800;font-size:18px;margin-top:4px}
.ko .verdict{color:var(--re)}.ok .verdict{color:var(--gr)}
.fade{opacity:0;transition:opacity .9s}.fade.on{opacity:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s ease}.draw.on{stroke-dashoffset:0}
.hl{background:#ffe680;border-radius:3px;padding:0 3px}
.rule{margin-top:14px;padding:10px 14px;border:2px solid var(--cy);border-radius:10px;background:#e8f6fa;opacity:0;transition:opacity .6s}
.rule.on{opacity:1}
@media(max-width:800px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>ES46 <small>Constructibles ?</small></h1>
<div class="consigne">Parmi les triangles ci-dessous, indique ceux qui sont impossibles à construire. Justifie ta réponse.</div>
<div class="bar"><button id="go">Suivant</button><button id="rs">Recommencer</button></div>
<div id="rows"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const C=(cx,cy,r,col,dl,du)=>`<circle class="draw" pathLength="1" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="1.3"${du?` style="transition-duration:${du}s;transition-delay:${dl}s"`:''}/>`;
const X=(x,y,col)=>`<path class="fade" d="M${x-4} ${y-4}L${x+4} ${y+4}M${x-4} ${y+4}L${x+4} ${y-4}" stroke="${col}" stroke-width="1.5"/>`;
const TX=(x,y,t,col,a)=>`<text class="fade" x="${x}" y="${y}" text-anchor="${a||'middle'}" font-size="14" font-weight="700" fill="${col}">${t}</text>`;
const T=[
 {n:'Triangle 1',d:'4 cm, 11 cm, 16 cm',ok:false,lt:[900,6900,7800],
  l:['On trace le segment de <b>16 cm</b>','Les cercles <b>ne se coupent pas</b>'],v:'Impossible à construire car 16&nbsp;&gt;&nbsp;4&nbsp;+&nbsp;11',
  fig:()=>`<svg viewBox="-50 -115 330 230">${C(0,0,40,'#e07b00',1.6,2.2)}${C(160,0,110,'#7a3bbf',4.0,2.8)}<line class="draw" pathLength="1" x1="0" y1="0" x2="160" y2="0" stroke="#222" stroke-width="1.8"/>${X(0,0,'#222')}${X(160,0,'#222')}${TX(0,16,'A','#222')}${TX(160,16,'B','#222')}${TX(80,30,'16 cm','#222')}</svg>`},
 {n:'Triangle 2',d:'70°, 75°, 45°',ok:false,nofig:true,lt:[900,2600,4300],
  l:['70° + 75° + 45° = <b>190°</b>','Or, la somme des angles d\'un triangle vaut <b>180°</b>'],v:'Impossible à construire car la somme des angles ne vaut pas 180°',
  fig:()=>''},
 {n:'Triangle 3',d:'5 cm, 4 cm, 9 cm',ok:false,lt:[900,6900,7800],
  l:['On trace le segment de <b>9 cm</b>','Les cercles <b>se touchent en un seul point</b>'],v:'Impossible à construire car 9&nbsp;=&nbsp;5&nbsp;+&nbsp;4',
  fig:()=>`<svg viewBox="-60 -62 200 124">${C(0,0,50,'#e07b00',1.6,2.2)}${C(90,0,40,'#7a3bbf',4.0,2.8)}<line class="draw" pathLength="1" x1="0" y1="0" x2="90" y2="0" stroke="#222" stroke-width="1.8"/>${X(0,0,'#222')}${X(90,0,'#222')}<circle class="fade" style="transition-delay:6.8s" cx="50" cy="0" r="4" fill="#d6232a"/>${TX(0,18,'A','#222')}${TX(90,18,'B','#222')}${TX(45,34,'9 cm','#222')}</svg>`},
 {n:'Triangle 4',d:'3 cm, 5 cm, 4 cm',ok:true,lt:[900,6900,8000],
  l:['On trace le segment de <b>5 cm</b>','Les cercles se coupent en <b>C</b>'],v:'Constructible',
  fig:()=>`<svg viewBox="-62 -82 235 164">${C(0,0,54,'#e07b00',1.6,2.2)}${C(90,0,72,'#7a3bbf',4.0,2.8)}<line class="draw" pathLength="1" x1="0" y1="0" x2="90" y2="0" stroke="#222" stroke-width="1.8"/>${X(0,0,'#222')}${X(90,0,'#222')}<polygon class="fade" style="transition-delay:7.4s" points="0,0 90,0 32.4,-43.2" fill="#e2f4e9" fill-opacity=".7" stroke="#1a9a55" stroke-width="2.5" stroke-linejoin="round"/><g class="fade" style="transition-delay:6.8s">${X(32.4,-43.2,'#1a9a55')}</g>${TX(-9,16,'A','#222')}${TX(99,16,'B','#222')}${TX(32.4,-52,'C','#1a9a55')}${TX(45,30,'5 cm','#222')}</svg>`}
];
const rows=document.getElementById('rows');
T.forEach((t,i)=>{const r=document.createElement('div');r.className='row '+(t.ok?'ok':'ko')+(t.nofig?' nofig':'');r.id='r'+i;
 r.innerHTML=`<div><div class="t">${t.n}</div><div class="d">${t.d}</div></div>${t.nofig?'':'<div>'+t.fig()+'</div>'}<div class="just">${t.l.map(x=>`<div class="line">${x}</div>`).join('')}<div class="verdict line">${t.ok?'✓':'✗'} ${t.v}</div></div>`;rows.appendChild(r)});
document.querySelectorAll('.row svg').forEach(v=>{const w=+v.getAttribute('viewBox').split(' ')[2];v.style.maxWidth=(w*1.3)+'px';v.style.margin='0 auto'});
let timers=[],running=false;
const go=document.getElementById('go');
function later(f,ms){timers.push(setTimeout(f,ms))}
function reset(){timers.forEach(clearTimeout);timers=[];running=false;go.disabled=false;
 document.querySelectorAll('.on,.done').forEach(e=>e.classList.remove('on','done'));}
function play(){if(running)return;running=true;go.disabled=true;let t=200;
 T.forEach((x,i)=>{const r=document.getElementById('r'+i);
  later(()=>{r.classList.add('on');r.scrollIntoView({behavior:'smooth',block:'center'})},t);
  later(()=>r.querySelectorAll('.draw,.fade').forEach(e=>e.classList.add('on')),t+400);
  const L=r.querySelectorAll('.line');const tm=x.lt||[...L].map((_,k)=>900+k*900);L.forEach((l,k)=>later(()=>l.classList.add('on'),t+tm[k]));
  const end=tm[tm.length-1]+500;later(()=>r.classList.add('done'),t+end);
  t+=end+900;});
 later(()=>{running=false},t);}
go.onclick=play;document.getElementById('rs').onclick=()=>{reset();window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
