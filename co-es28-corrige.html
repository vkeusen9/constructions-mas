const mask=mk("mask",{id:"mk",maskUnits:"userSpaceOnUse",x:O.x-R-30,y:O.y-R-30,width:2*R+60,height:2*R+60},defs);
const mc=mk("circle",{cx:O.x,cy:O.y,r:R,fill:"none",stroke:"#fff","stroke-width":30,transform:`rotate(-90 ${O.x} ${O.y})`},mask);
const circ=reg(ghost(mk("circle",{cx:O.x,cy:O.y,r:R,fill:"none",stroke:GR,"stroke-width":2,"stroke-dasharray":"9 6",mask:"url(#mk)"})));
const CG=2700;   /* durée de la construction d'une bissectrice */
const steps=[{run(a){}},{run(a){
  tri.forEach((l,i)=>draw(l,a,800,a?i*700:0));fade(gV,a,400,a?300:0);
  const t0=2400;
  cons.forEach((c,i)=>{const d=t0+i*CG;
    draw(c.arc0,a,700,a?d:0);fade(c.gd,a,300,a?d+600:0);
    draw(c.arcP,a,500,a?d+900:0);draw(c.arcQ,a,500,a?d+1400:0);fade(c.gR,a,300,a?d+1900:0);
    draw(c.line,a,700,a?d+2000:0)});
  const t1=t0+3*CG+200;
  fade(gO,a,400,a?t1:0);
  perp.forEach((p,i)=>{draw(p.l,a,600,a?t1+600+i*700:0);fade(p.ra,a,300,a?t1+1100+i*700:0)});
  const t2=t1+600+3*700+200;
  perp.forEach((p,i)=>fade(p.tk,a,400,a?t2+i*250:0));
  const t3=t2+1100;
  circ.style.opacity=1;
  if(!a){mc.style.strokeDasharray="";}
  else{
    const L=2*Math.PI*R;
    mc.style.transition="none";mc.style.strokeDasharray=L;mc.style.strokeDashoffset=L;
    void mc.getBoundingClientRect();
    at(t3,()=>{mc.style.transition="stroke-dashoffset 2200ms ease-in-out";mc.style.strokeDashoffset=0});
  }
}}];
let cur=0;
function render(s,anim){
  cancel();
  all.forEach(e=>{e.style.transition="none";e.style.opacity=0;e.style.strokeDasharray=e===circ?"9 6":""});
  mc.style.transition="none";mc.style.strokeDasharray="";mc.style.strokeDashoffset=0;
  for(let i=1;i<=s;i++)steps[i].run(anim&&i===s);
  cur=s;
  $("dots").innerHTML=steps.map((_,i)=>`<i class="${i<=s?"on":""} ${i===s?"cur":""}"></i>`).join("");
  $("bPrev").style.visibility=s===0?"hidden":"visible";
  $("bNext").style.visibility=s===steps.length-1?"hidden":"visible";
}
const next=()=>{if(cur<steps.length-1)render(cur+1,true)};
const prev=()=>{if(cur>0)render(cur-1,false)};
$("bNext").onclick=e=>{e.stopPropagation();next()};
$("bPrev").onclick=e=>{e.stopPropagation();prev()};
$("fig").onclick=next;
document.addEventListener("keydown",e=>{
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();next()}
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev()}
});
render(0,false);
</script>
</body>
</html>
