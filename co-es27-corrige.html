function clipPoly(poly,h){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const A=poly[i],B=poly[(i+1)%poly.length],fa=h.f(A),fb=h.f(B);

/* médiatrices */
const med=CITIES.map((c,i)=>{
  const h=halves[i],M=h.M,d=nrm(h.n),u={x:-d.y,y:d.x};
  const [A,B]=lineSeg(M,u,[]);
  const ring=reg(ghost(mk("circle",{cx:c.p.x,cy:c.p.y,r:11,fill:"none",stroke:c.c,"stroke-width":2.8})));
  const seg=reg(ghost(mk("line",{x1:G.x,y1:G.y,x2:c.p.x,y2:c.p.y,stroke:c.c,"stroke-width":1.6,"stroke-dasharray":"7 5"})));
  const g=reg(ghost(mk("g",{})));
  [0.25,0.75].forEach(k=>{const p={x:G.x+k*(c.p.x-G.x),y:G.y+k*(c.p.y-G.y)};
    mk("line",{x1:p.x-u.x*8,y1:p.y-u.y*8,x2:p.x+u.x*8,y2:p.y+u.y*8,stroke:c.c,"stroke-width":2.2,"stroke-linecap":"round"},g)});
  const r=13,q1={x:M.x-d.x*r,y:M.y-d.y*r},q2={x:M.x-d.x*r+u.x*r,y:M.y-d.y*r+u.y*r},q3={x:M.x+u.x*r,y:M.y+u.y*r};
  mk("polyline",{points:`${q1.x},${q1.y} ${q2.x},${q2.y} ${q3.x},${q3.y}`,fill:"none",stroke:c.c,"stroke-width":1.8},g);
  const line=reg(ghost(mk("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:c.c,"stroke-width":2.4,"stroke-linecap":"round"})));
  return {ring,seg,g,line};
});
/* zone : voile hors de la zone, remplissage, bords en couleur */
const pts=cell.map(p=>p.x+","+p.y).join(" ");
const veil=reg(ghost(mk("path",{d:`M${RECT.x0} ${RECT.y0}H${RECT.x1}V${RECT.y1}H${RECT.x0}Z M${cell.map(p=>p.x+" "+p.y).join("L")}Z`,fill:"#fff","fill-opacity":.72,"fill-rule":"evenodd"})));
const zone=reg(ghost(mk("polygon",{points:pts,fill:"#ffd24d","fill-opacity":.38})));
const edges=CITIES.map((c,i)=>{
  const h=halves[i],d=nrm(h.n),u={x:-d.y,y:d.x};
  const others=halves.filter((_,j)=>j!==i);
  const [A,B]=lineSeg(h.M,u,others);
  return reg(ghost(mk("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:c.c,"stroke-width":5.5,"stroke-linecap":"round"})));
});
const ringsTop=reg(ghost(mk("g",{})));
mk("circle",{cx:G.x,cy:G.y,r:13,fill:"none",stroke:"#222","stroke-width":3.2},ringsTop);
const GAP=2500;
const medRun=(o,a,d)=>{
  fade(o.ring,a,400,a?d:0);
  draw(o.seg,a,800,a?d+200:0);
  fade(o.g,a,400,a?d+1000:0);
  draw(o.line,a,1300,a?d+1400:0);
};
const steps=[{run(a){}},{run(a){
  med.forEach((o,i)=>medRun(o,a,i*GAP));
  const z=med.length*GAP+300;
  fade(veil,a,800,a?z:0);fade(zone,a,800,a?z+400:0);
  edges.forEach((e,i)=>fade(e,a,500,a?z+900+i*150:0));
  fade(ringsTop,a,500,a?z+800:0);
}}];
let cur=0;
function render(s,anim){
  cancel();
  all.forEach(e=>{e.style.transition="none";e.style.opacity=0;e.style.strokeDasharray=""});
  med.forEach(o=>o.seg.style.strokeDasharray="7 5");
  for(let i=1;i<=s;i++)steps[i].run(anim&&i===s);
  cur=s;
  $("dots").innerHTML=steps.map((_,i)=>`<i class="${i<=s?"on":""} ${i===s?"cur":""}"></i>`).join("");
  $("bPrev").style.visibility=s===0?"hidden":"visible";
  $("bNext").style.visibility=s===steps.length-1?"hidden":"visible";
}
const next=()=>{if(cur<steps.length-1)render(cur+1,true)};
const prev=()=>{if(cur>0)render(cur-1,false)};
$("bNext").onclick=e=>{e.stopPropagation();next()};
$("bPrev").onclick=e=>{e.stopPropagation();prev()};
$("fig").onclick=next;
document.addEventListener("keydown",e=>{
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();next()}
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev()}
});
render(0,false);
</script>
</body>
</html>
