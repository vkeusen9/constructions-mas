function buildTri(tr){
  const P=tr.P,n=tr.n,{O}=circum(P[0],P[1],P[2]),Hh=V(P[0].x+P[1].x+P[2].x-2*O.x,P[0].y+P[1].y+P[2].y-2*O.y),cons=[],cn=e=>{cons.push(e);return e};
  let rt=-1;for(let j=0;j<3;j++){const a=unit(sub(P[(j+1)%3],P[j])),b=unit(sub(P[(j+2)%3],P[j]));if(Math.abs(dot(a,b))<.03)rt=j}
  const Hpt=rt>=0?P[rt]:Hh;tr.ext.push(Hpt);
  for(let i=0;i<3;i++){
    const col=COLS[i],Vx=P[i],Q=P[(i+1)%3],W=P[(i+2)%3];
    if(rt>=0&&i!==rt){
      const R=P[rt],other=P[3-i-rt],l=mkLine(Vx,R,col,2.6);
      beat([[l,"d",800]],450);continue;
    }
    const s=unit(sub(W,Q)),sl=len(sub(W,Q)),tF=dot(sub(Vx,Q),s),F=add(Q,mul(s,tF)),dv=sub(F,Vx),d=len(dv),dn=unit(dv);
    const h=Math.min(.38*d,75),m=.7*h,rho=Math.hypot(d,h),rho2=Math.hypot(h,m);
    const E1=sub(F,mul(s,h)),E2=add(F,mul(s,h)),X=add(F,mul(dn,m));tr.ext.push(E1,E2,X);
    const ext=[],tmin=tF-h-18,tmax=tF+h+18;
    if(tmin<0){const e=add(Q,mul(s,tmin));ext.push([mkLine(Q,e,GRY,1.1,[7,5]),"f",600]);tr.ext.push(e)}
    if(tmax>sl){const e=add(Q,mul(s,tmax));ext.push([mkLine(W,e,GRY,1.1,[7,5]),"f",600]);tr.ext.push(e)}
    if(ext.length)beat(ext,100);
    const a0=cn(arcSpan(Vx,rho,[E1,E2],.12,col,1.1)),dE=cn(mkDot(E1,col,2.6)),dE2=cn(mkDot(E2,col,2.6));
    beat([[a0,"d",750],[dE,"f",250,650],[dE2,"f",250,650]],150);
    const b1=cn(arcSpan(E1,rho2,[X],.32,col,1.1)),b2=cn(arcSpan(E2,rho2,[X],.32,col,1.1)),dX=cn(mkDot(X,col,2.6));
    beat([[b1,"d",750],[b2,"d",750],[dX,"f",250,650]],150);
    const tH=dot(sub(Hpt,Vx),dv)/dot(dv,dv);let s0=Vx,e0=X;
    if(tH>1+m/d+.02){e0=add(Hpt,mul(dn,12));tr.ext.push(e0)}else if(tH<-.02){s0=sub(Hpt,mul(dn,12));tr.ext.push(s0)}
    const l=mkLine(s0,e0,col,2.6),mrk=cn(mkRight(F,neg(dn),dot(sub(mid(Q,W),F),s)>=0?s:neg(s),col,11,1.8));
    beat([[l,"d",900],[mrk,"f",300,800]],450);
  }
  beat(cons.map(e=>[e,"x",700]),150);
  const ring=mkRing(Hpt,MAG,11,2.2),dt=mkDot(Hpt,MAG,4.5);
  beat([[ring,"f",600],[dt,"f",600]],900);
}

D.tris.forEach((tr,ix)=>{tr.ix=ix;tr.ext=tr.P.slice();zoomTo(()=>tr.ext,1000);buildTri(tr)});
const pageBB=[V(20,Math.min(...D.tris.map(t=>Math.min(...t.P.map(p=>p.y))))-80),V(D.W-20,(D.ans?D.ans.y+40:Math.max(...D.tris.map(t=>Math.max(...t.P.map(p=>p.y))))+70))];
FULLBB=bbox(pageBB.concat(...D.tris.map(t=>t.ext)));
zoomTo(()=>[V(FULLBB.x0,FULLBB.y0),V(FULLBB.x1,FULLBB.y1)],1300);
if(D.ans){const a=mkLabel(V(D.ans.x,D.ans.y),D.ans.t,MAG,0,0,28);a.setAttribute("text-anchor","start");
  regs.push(s=>{a.setAttribute("x",D.ans.x+12);a.setAttribute("y",D.ans.y-9);a.setAttribute("font-size",28)});
  a.setAttribute("font-style","normal");beat([[a,"f",800]],300,FINALCAP)}
else capOnly(FINALCAP,300);
render(0,false);
</script>
