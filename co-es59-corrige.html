    l.setAttribute("x1",c.x-pr.x*L);l.setAttribute("y1",c.y-pr.y*L);l.setAttribute("x2",c.x+pr.x*L);l.setAttribute("y2",c.y+pr.y*L);l.setAttribute("stroke-width",wpx/s)})});return ghost(g)}
function mkLabel(p,str,col,dx,dy,px=24){const e=mk("text",{fill:col,"font-weight":700,"font-style":"italic","text-anchor":"middle"});e.textContent=str;
  regs.push(s=>{e.setAttribute("x",p.x+dx/s);e.setAttribute("y",p.y+dy/s);e.setAttribute("font-size",px/s)});return ghost(e)}
function circum(A,B,C){const d=2*(A.x*(B.y-C.y)+B.x*(C.y-A.y)+C.x*(A.y-B.y));
  const a2=A.x*A.x+A.y*A.y,b2=B.x*B.x+B.y*B.y,c2=C.x*C.x+C.y*C.y;
  const O=V((a2*(B.y-C.y)+b2*(C.y-A.y)+c2*(A.y-B.y))/d,(a2*(C.x-B.x)+b2*(A.x-C.x)+c2*(B.x-A.x))/d);return{O,R:len(sub(O,A))}}
/* animations */
function fade(e,dur){e.style.transition="none";e.style.opacity=0;void e.getBoundingClientRect();e.style.transition=`opacity ${dur}ms ease`;e.style.opacity=1}
function draw(e,dur){const L=e.getTotalLength();e.style.transition="none";e.style.strokeDasharray=L;e.style.strokeDashoffset=L;e.style.opacity=1;void e.getBoundingClientRect();
  e.style.transition=`stroke-dashoffset ${dur}ms ease-in-out`;e.style.strokeDashoffset=0;at(dur+60,()=>{e.style.strokeDasharray="";e.style.strokeDashoffset="";e.style.transition="none"})}
/* temps */
let T=0,TL=[],ALL=[],SP=1;const KILL=new Set();
function beat(list,pause=150,cap){const t0=T;let end=0;if(cap!==undefined)TL.push({t:t0,cap});
  list.forEach(([e,k,dur,dl=0])=>{dur*=SP;dl*=SP;TL.push({t:t0+dl,e,k,dur});if(k==="x")KILL.add(e);else ALL.push(e);end=Math.max(end,dl+dur)});T=t0+end+pause*SP}
function zoomTo(fn,dur=900){dur*=SP;TL.push({t:T,zb:fn,dur});T+=dur+100*SP}
function capOnly(txt,pause=0){TL.push({t:T,cap:txt});T+=pause}
let FULLBB=null,FINALCAP="",cur=0;
function resetAll(){ALL.forEach(e=>{e.style.transition="none";e.style.opacity=0;e.style.strokeDasharray="";e.style.strokeDashoffset=""})}
function render(s,anim){
  cancel();resetAll();cur=s;
  if(s===0){$("def").textContent=D.instr;setVB(fitVB(FULLBB,10))}
  else if(!anim){ALL.forEach(e=>{e.style.opacity=KILL.has(e)?0:1});$("def").textContent=D.instr;setVB(fitVB(FULLBB,10))}
  else{
    setVB(fitVB(FULLBB,10));$("def").textContent=D.instr;
    TL.forEach(x=>at(x.t,()=>{
      if(x.zb)tweenVB(fitVB(bbox(x.zb())),x.dur);
      if(x.e){if(x.k==="d")draw(x.e,x.dur);else if(x.k==="x"){x.e.style.transition=`opacity ${x.dur}ms ease`;x.e.style.opacity=0}else fade(x.e,x.dur)}
    }));
  }
  $("dots").innerHTML=[0,1].map(i=>`<i class="${i<=s?"on":""} ${i===s?"cur":""}"></i>`).join("");
  $("bPrev").style.visibility=s===0?"hidden":"visible";
  $("bNext").style.visibility=s===1?"hidden":"visible";
}
const next=()=>{if(cur===0)render(1,true)},prev=()=>{if(cur===1)render(0,false)};
$("bNext").onclick=e=>{e.stopPropagation();next()};
$("bPrev").onclick=e=>{e.stopPropagation();prev()};
$("fig").onclick=next;
document.addEventListener("keydown",e=>{
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();next()}
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev()}
});
/* image + masque du titre */
mk("image",{href:"data:image/png;base64,"+D.base,x:0,y:0,width:D.W,height:D.H});
mk("rect",{x:-4000,y:-4000,width:9000,height:4200,fill:"#fff"});
D.tris=D.tris.map(t=>({n:t.n,P:t.P.map(([x,y])=>V(x,y))}));
/* sur-couche des étiquettes d'origine : aucune */

SP=.92;
function buildTri(tr){
  const P=tr.P,n=tr.n,{O,R}=circum(P[0],P[1],P[2]),cons=[],cn=e=>{cons.push(e);return e};
  tr.ext.push(V(O.x-R,O.y-R),V(O.x+R,O.y+R));
  for(let k=0;k<3;k++){
    const col=COLS[k],p=P[k],q=P[(k+1)%3],L=len(sub(q,p)),M=mid(p,q),u=unit(sub(q,p));let nn=V(-u.y,u.x);if(dot(nn,sub(O,M))<0)nn=neg(nn);
    const r=.62*L,kk=Math.sqrt(r*r-L*L/4),X1=add(M,mul(nn,kk)),X2=sub(M,mul(nn,kk));
    const a1=cn(arcSpan(p,r,[X1,X2],.1,col,1.1)),a2=cn(arcSpan(q,r,[X1,X2],.1,col,1.1)),d1=cn(mkDot(X1,col,2.6)),d2=cn(mkDot(X2,col,2.6));
    beat([[a1,"d",750],[a2,"d",750],[d1,"f",250,650],[d2,"f",250,650]],150);
    const tO=dot(sub(O,M),nn),t1=Math.min(-kk-14,tO-20),t2=Math.max(kk+14,tO+20),e1=add(M,mul(nn,t1)),e2=add(M,mul(nn,t2));tr.ext.push(e1,e2);
    const l=mkLine(e1,e2,col,2.2),tk=[cn(mkTicks(mid(p,M),u,k+1,col)),cn(mkTicks(mid(M,q),u,k+1,col))],ra=cn(mkRight(M,u,nn,col,11,1.8));
    beat([[l,"d",800],[tk[0],"f",300,800],[tk[1],"f",300,800],[ra,"f",300,800]],450);
  }
  const dO=mkDot(O,MAG,4.5),rO=mkRing(O,MAG,10,2),lab=mkLabel(O,"O",MAG,16,-12);
  beat([[dO,"f",500],[rO,"f",500],[lab,"f",500]],300);
  beat(cons.map(e=>[e,"x",700]),150);
  const c=mkCircle(O,R,angOf(O,P[0]),BLU,2.2);
  beat([[c,"d",1700]],900);
}

D.tris.forEach((tr,ix)=>{tr.ix=ix;tr.ext=tr.P.slice();zoomTo(()=>tr.ext,1000);buildTri(tr)});
const pageBB=[V(20,Math.min(...D.tris.map(t=>Math.min(...t.P.map(p=>p.y))))-80),V(D.W-20,(D.ans?D.ans.y+40:Math.max(...D.tris.map(t=>Math.max(...t.P.map(p=>p.y))))+70))];
FULLBB=bbox(pageBB.concat(...D.tris.map(t=>t.ext)));
zoomTo(()=>[V(FULLBB.x0,FULLBB.y0),V(FULLBB.x1,FULLBB.y1)],1300);
if(D.ans){const a=mkLabel(V(D.ans.x,D.ans.y),D.ans.t,MAG,0,0,28);a.setAttribute("text-anchor","start");
  regs.push(s=>{a.setAttribute("x",D.ans.x+12);a.setAttribute("y",D.ans.y-9);a.setAttribute("font-size",28)});
  a.setAttribute("font-style","normal");beat([[a,"f",800]],300,FINALCAP)}
else capOnly(FINALCAP,300);
render(0,false);
</script>
