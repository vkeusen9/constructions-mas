<title>ES24_corrigé</title>
<style>
:root{--cy:#0099b8;--box:#dbeaf6;--ink:#222}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:8px 16px 10px}
h1{margin:0 0 6px;font-size:30px;color:var(--cy);border-bottom:3px solid var(--cy);padding-bottom:4px}
h1 small{font-size:30px;font-weight:700;margin-right:12px}
.q{background:var(--box);border-radius:3px;padding:8px 14px;font-size:17px;line-height:1.4}
.q p{margin:2px 0}
.nav{display:flex;align-items:center;gap:12px;margin:8px 0}
.nb{font:inherit;border:2px solid var(--cy);background:#fff;color:var(--cy);border-radius:8px;padding:7px 18px;font-size:18px;font-weight:700;cursor:pointer}
.nb:hover{background:#e6f6fa}
.nb.go{background:var(--cy);color:#fff}
.nb.go:hover{background:#007f9a}
.dots{flex:1;display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#cfe6ee}
.dots i.on{background:var(--cy)}
.dots i.cur{box-shadow:0 0 0 3px #bfe3ee}
.main{display:flex;justify-content:center}
.fig{flex:none;border:1px solid #cfe0ea;border-radius:8px;cursor:pointer;background:#fff}
svg{display:block;height:calc(100vh - 150px);min-height:360px;width:auto;max-width:100%}
svg text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.side{flex:1;min-width:260px}
.side h2{margin:0 0 10px;font-size:20px;color:var(--cy)}
.ln{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:20px;line-height:1.4;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.ln.on{opacity:1;transform:none}
.ln b{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;text-align:center;line-height:26px;font-size:16px;margin-top:1px}
.l1{background:#ffe9c7}.l2{background:#d6e9fa}.l3{background:#d3f0dd}
</style>
</head>

const NS="http://www.w3.org/2000/svg",svg=document.getElementById("stage");
const OR="#e07b00",BL="#1a8fd0",RED="#d6232a",INK="#222";
const E1={x:93,y:583},E2={x:564,y:428};
const tos=new Set();
const at=(ms,f)=>tos.add(setTimeout(f,ms));
const cancel=()=>{tos.forEach(clearTimeout);tos.clear()};
function mk(tag,a,par){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(par||svg).appendChild(e);return e}
const ghost=e=>{e.style.opacity=0;return e};
function fade(e,anim,dur=500,delay=0){
  e.style.transition="none";
  if(!anim){e.style.opacity=1;return}
  e.style.opacity=0;void e.getBoundingClientRect();
  e.style.transition=`opacity ${dur}ms ease ${delay}ms`;e.style.opacity=1;
}
function draw(e,anim,dur=900,delay=0){
  if(!anim){e.style.transition="none";e.style.opacity=1;e.style.strokeDasharray="";return}
  const L=e.getTotalLength();
  e.style.transition="none";e.style.strokeDasharray=L;e.style.strokeDashoffset=L;e.style.opacity=1;

  e.style.transition=`stroke-dashoffset ${dur}ms ease-in-out ${delay}ms`;e.style.strokeDashoffset=0;

/* géométrie */
const O={x:(E1.x+E2.x)/2,y:(E1.y+E2.y)/2};
const L=Math.hypot(E2.x-E1.x,E2.y-E1.y);

const M={x:O.x+k*nv.x,y:O.y+k*nv.y},N={x:O.x-k*nv.x,y:O.y-k*nv.y};
function arc(C){
  const ang=P=>Math.atan2(P.y-C.y,P.x-C.x);
  const aM=ang(M),aN=ang(N);
  let d=aM-aN;d=((d+3*Math.PI)%(2*Math.PI))-Math.PI;

function tick(par,p,dir,col){
  const pr={x:-dir.y,y:dir.x};
  mk("line",{x1:p.x-pr.x*9,y1:p.y-pr.y*9,x2:p.x+pr.x*9,y2:p.y+pr.y*9,stroke:col,"stroke-width":3,"stroke-linecap":"round"},par);
}
function coinL(par,c,d1,d2,off=8,len=13,col=INK){
  const q={x:c.x+off*(d1.x+d2.x),y:c.y+off*(d1.y+d2.y)};
  mk("polyline",{points:`${q.x+len*d1.x},${q.y+len*d1.y} ${q.x},${q.y} ${q.x+len*d2.x},${q.y+len*d2.y}`,fill:"none",stroke:col,"stroke-width":2.6},par);

mk("image",{href:"data:image/png;base64,"+D.base,x:0,y:0,width:D.W,height:D.H});

tick(gMark,{x:(E1.x+O.x)/2,y:(E1.y+O.y)/2},u,OR);tick(gMark,{x:(O.x+E2.x)/2,y:(O.y+E2.y)/2},u,OR);

const steps=[
 {t:null,run(a){}},
 {t:"t1",run(a){fade(gRing,a,400);draw(seg,a,1000,a?300:0)}},
 {t:"t2",run(a){
   draw(arcA,a,1400);draw(arcB,a,1400,a?1500:0);fade(gMN,a,400,a?2900:0);
   draw(med,a,1300,a?3300:0);fade(gMark,a,500,a?4300:0)}},
 {t:"t3",run(a){comps.forEach((c,i)=>fade(c,a,600,a?i*450:0))}}
];
let cur=0;
const $=id=>document.getElementById(id);
function render(s,anim){
  cancel();
  [...comps,gRing,seg,arcA,arcB,gMN,med,gMark].forEach(e=>{e.style.transition="none";e.style.opacity=0;e.style.strokeDasharray=""});
  for(let i=1;i<=s;i++){steps[i].run(anim&&i===s)}
  cur=s;
  $("dots").innerHTML=steps.map((_,i)=>`<i class="${i<=s?"on":""} ${i===s?"cur":""}"></i>`).join("");

const next=()=>{if(cur<steps.length-1)render(cur+1,true)};

});
