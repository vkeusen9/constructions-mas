const NS="http://www.w3.org/2000/svg",svg=document.getElementById("stage");
const RED="#d6232a",BL="#1a8fd0",INK="#222",OR="#e07b00",GR="#1a9a55";
const tos=new Set(),rafs=new Set();
const at=(ms,f)=>tos.add(setTimeout(f,ms));
const cancel=()=>{tos.forEach(clearTimeout);tos.clear();rafs.forEach(cancelAnimationFrame);rafs.clear()};
const $=id=>document.getElementById(id);
function mk(tag,a,par){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(par||svg).appendChild(e);return e}
const ghost=e=>{e.style.opacity=0;return e};
function fade(e,anim,dur=500,delay=0){
  e.style.transition="none";
  if(!anim){e.style.opacity=1;return}
  e.style.opacity=0;void e.getBoundingClientRect();
  e.style.transition=`opacity ${dur}ms ease ${delay}ms`;e.style.opacity=1;
}
function draw(e,anim,dur=900,delay=0){
  if(!anim){e.style.transition="none";e.style.opacity=1;e.style.strokeDasharray="";return}
  const L=e.getTotalLength();
  e.style.transition="none";e.style.strokeDasharray=L;e.style.strokeDashoffset=L;e.style.opacity=1;
  void e.getBoundingClientRect();
  e.style.transition=`stroke-dashoffset ${dur}ms ease-in-out ${delay}ms`;e.style.strokeDashoffset=0;
  at(dur+delay+60,()=>{e.style.strokeDasharray="";e.style.transition="none"});
}

function grow(e,A,B,anim,dur=1000,delay=0){
  e.setAttribute("x1",A.x);e.setAttribute("y1",A.y);
  const set=k=>{e.setAttribute("x2",A.x+k*(B.x-A.x));e.setAttribute("y2",A.y+k*(B.y-A.y))};
  if(!anim){set(1);e.style.opacity=1;return}
  set(0);
  at(delay,()=>{e.style.opacity=1;const t0=performance.now();const f=n=>{const k=Math.min(1,(n-t0)/dur);set(k);if(k<1)rafs.add(requestAnimationFrame(f))};rafs.add(requestAnimationFrame(f))});
}
const nrm=v=>{const l=Math.hypot(v.x,v.y);return{x:v.x/l,y:v.y/l}};
const TAU=2*Math.PI,mod=x=>((x%TAU)+TAU)%TAU;
function arcPath(C,r,a1,sweep,sg){
  const p=a=>({x:C.x+r*Math.cos(a),y:C.y+r*Math.sin(a)});
  const a2=a1+sg*sweep,p1=p(a1),p2=p(a2);
  return `M${p1.x} ${p1.y}A${r} ${r} 0 ${sweep>Math.PI?1:0} ${sg>0?1:0} ${p2.x} ${p2.y}`;
}
const ang=(C,X)=>Math.atan2(X.y-C.y,X.x-C.x);
const arcA=(C,r,a1,a2,col="#1a8fd0",w=1.3)=>{  /* arc le plus court de a1 à a2 */
  const d=mod(a2-a1);const sg=d<Math.PI?1:-1,sw=d<Math.PI?d:TAU-d;
  return mk("path",{d:arcPath(C,r,a1,sw,sg),fill:"none",stroke:col,"stroke-width":w,"stroke-linecap":"round"});
};
function ticks(par,p,dir,n,col,len=9,w=2){
  const pr={x:-dir.y,y:dir.x};
  for(let i=0;i<n;i++){
    const o=(i-(n-1)/2)*6,c={x:p.x+dir.x*o,y:p.y+dir.y*o};
    mk("line",{x1:c.x-pr.x*len/2,y1:c.y-pr.y*len/2,x2:c.x+pr.x*len/2,y2:c.y+pr.y*len/2,stroke:col,"stroke-width":w,"stroke-linecap":"round"},par);
  }
}
const defs=[
 {V:{x:299.8,y:253.1},u1:{x:-.8652,y:.5014},u2:{x:.9301,y:.3673},bis:"convex",r1:80,r2:130,len:280},
 {V:{x:779.4,y:378.9},u1:{x:.9922,y:-.1245},u2:{x:-.3324,y:.9431},bis:"reflex",r1:80,r2:100,len:200},
 {V:{x:281.9,y:693.0},u1:{x:.8311,y:-.5562},u2:{x:-.8311,y:.5562},bis:{x:.5562,y:.8311},r1:90,r2:150,len:210}
];
mk("image",{href:"data:image/png;base64,"+D.base,x:0,y:0,width:D.W,height:D.H});
const mkArcR=(C,r,aR,half=.3)=>ghost(mk("path",{d:arcPath(C,r,aR-half,2*half,1),fill:"none",stroke:BL,"stroke-width":1.3,"stroke-linecap":"round"}));
function geom(o,r2){
  const V=o.V,s=nrm({x:o.u1.x+o.u2.x,y:o.u1.y+o.u2.y});
  const b=o.bis==="convex"?s:(o.bis==="reflex"?{x:-s.x,y:-s.y}:o.bis);
  const P={x:V.x+o.r1*o.u1.x,y:V.y+o.r1*o.u1.y},Q={x:V.x+o.r1*o.u2.x,y:V.y+o.r1*o.u2.y};
  const Mid={x:(P.x+Q.x)/2,y:(P.y+Q.y)/2};
  const hh=Math.sqrt(r2*r2-Math.pow(Math.hypot(Q.x-P.x,Q.y-P.y)/2,2));
  const R1={x:Mid.x+hh*b.x,y:Mid.y+hh*b.y},R2={x:Mid.x-hh*b.x,y:Mid.y-hh*b.y};
  const E={x:V.x+o.len*b.x,y:V.y+o.len*b.y};
  return {V,b,P,Q,Mid,hh,R1,R2,E};
}
function baseArc(o,g){
  const V=o.V,aP=ang(V,g.P),aQ=ang(V,g.Q),aB=Math.atan2(g.b.y,g.b.x);
  const sg=mod(aB-aP)<mod(aQ-aP)?1:-1,sweep=sg>0?mod(aQ-aP):mod(aP-aQ),dl=.12;
  return ghost(mk("path",{d:arcPath(V,o.r1,aP-sg*dl,sweep+2*dl,sg),fill:"none",stroke:BL,"stroke-width":1.3,"stroke-linecap":"round"}));
}
const dot=(g,p)=>mk("circle",{cx:p.x,cy:p.y,r:3.2,fill:INK},g);
const all=[];
const reg=e=>{all.push(e);return e};

/* ---- angles A et C : une seule méthode ---- */
function simple(o){
  const g=geom(o,o.r2);
  const arc0=reg(baseArc(o,g)),arcP=reg(mkArcR(g.P,o.r2,ang(g.P,g.R1))),arcQ=reg(mkArcR(g.Q,o.r2,ang(g.Q,g.R1)));
  const gPQ=reg(ghost(mk("g",{})));dot(gPQ,g.P);dot(gPQ,g.Q);
  const gR=reg(ghost(mk("g",{})));dot(gR,g.R1);
  const bis=reg(ghost(mk("line",{x1:g.V.x,y1:g.V.y,x2:g.E.x,y2:g.E.y,stroke:RED,"stroke-width":2.2,"stroke-linecap":"round"})));
  return {run(a){
    fade(gPQ,a,300,a?1300:0);draw(arc0,a,1200);
    draw(arcP,a,900,a?1700:0);draw(arcQ,a,900,a?2700:0);fade(gR,a,300,a?3600:0);
    draw(bis,a,1400,a?4000:0)}};
}

/* ---- angle B : méthode 1 (marche à suivre) et méthode 2 ---- */
const oB=defs[1];
const g1=geom(oB,100),g2=geom(oB,125);
/* commun */
const b_arc0=reg(baseArc(oB,g1));
const b_PQ=reg(ghost(mk("g",{})));dot(b_PQ,g1.P);dot(b_PQ,g1.Q);
/* méthode 1 : arcs seulement du côté de l'angle saillant */
const m1_aP=reg(mkArcR(g1.P,100,ang(g1.P,g1.R2))),m1_aQ=reg(mkArcR(g1.Q,100,ang(g1.Q,g1.R2)));
const m1_R=reg(ghost(mk("g",{})));dot(m1_R,g1.R2);
const m1_dash=reg(ghost(mk("line",{x1:g1.R2.x,y1:g1.R2.y,x2:g1.V.x,y2:g1.V.y,stroke:RED,"stroke-width":2.2,"stroke-dasharray":"9 6"})));
const m1_bis=reg(ghost(mk("line",{x1:g1.V.x,y1:g1.V.y,x2:g1.E.x,y2:g1.E.y,stroke:RED,"stroke-width":2.2,"stroke-linecap":"round"})));
/* méthode 2 : ouverture agrandie, deux intersections, cerf-volant */
const arcTwo=C=>{
  const a1=ang(C,g2.R1),a2=ang(C,g2.R2),d=mod(a2-a1),sg=d<Math.PI?1:-1,sw=(d<Math.PI?d:TAU-d)+.28;
  return reg(ghost(mk("path",{d:arcPath(C,125,a1-sg*.14,sw,sg),fill:"none",stroke:BL,"stroke-width":1.3,"stroke-linecap":"round"})));
};
const m2_aP=arcTwo(g2.P),m2_aQ=arcTwo(g2.Q);
const m2_R=reg(ghost(mk("g",{})));dot(m2_R,g2.R1);dot(m2_R,g2.R2);
const m2_bis=reg(ghost(mk("line",{x1:g2.V.x,y1:g2.V.y,x2:g2.E.x,y2:g2.E.y,stroke:RED,"stroke-width":2.2,"stroke-linecap":"round"})));
const m2_F={x:g2.R2.x-30*g2.b.x,y:g2.R2.y-30*g2.b.y};
const m2_dash=reg(ghost(mk("line",{x1:g2.V.x,y1:g2.V.y,x2:g2.V.x,y2:g2.V.y,stroke:RED,"stroke-width":2.2,"stroke-dasharray":"9 6"})));
const kite=reg(ghost(mk("g",{})));
mk("polygon",{points:[g2.V,g2.P,g2.R2,g2.Q].map(p=>p.x+","+p.y).join(" "),fill:"#ffd37a","fill-opacity":.35,stroke:OR,"stroke-width":2.4,"stroke-linejoin":"round"},kite);
const kt=reg(ghost(mk("g",{})));
const mid=(A,B)=>({x:(A.x+B.x)/2,y:(A.y+B.y)/2}),dir=(A,B)=>nrm({x:B.x-A.x,y:B.y-A.y});
ticks(kt,mid(g2.V,g2.P),dir(g2.V,g2.P),1,OR);ticks(kt,mid(g2.V,g2.Q),dir(g2.V,g2.Q),1,OR);
ticks(kt,mid(g2.R2,g2.P),dir(g2.R2,g2.P),2,OR);ticks(kt,mid(g2.R2,g2.Q),dir(g2.R2,g2.Q),2,OR);
const eq=reg(ghost(mk("g",{})));
{const V=g2.V,aP=ang(V,g2.P),aQ=ang(V,g2.Q),aB=Math.atan2(-g2.b.y,-g2.b.x),r=34;
 [aP,aQ].forEach(a=>{
   arcA(V,r,a,aB,GR,2.4).setAttribute("stroke-linecap","butt");
   const d=mod(aB-a),sg=d<Math.PI?1:-1,sw=d<Math.PI?d:TAU-d,am=a+sg*sw/2;
   const c={x:V.x+r*Math.cos(am),y:V.y+r*Math.sin(am)};
   ticks(eq,c,{x:-Math.sin(am),y:Math.cos(am)},1,GR,11,2.4);
 });
 [...document.querySelectorAll("#stage > path")].slice(-2).forEach(p=>eq.appendChild(p));
}
let bMethod=1;
const NOTE1="On augmente l’ouverture du compas.";
const NOTE2="La diagonale (axe de symétrie) du cerf-volant coupe l’angle en deux angles isométriques.";
function setNote(txt){const n=$("note");n.textContent=txt||"";n.classList.toggle("on",!!txt)}
const stepB={run(a){
  if(bMethod===1){
    fade(b_PQ,a,300,a?1300:0);draw(b_arc0,a,1200);
    draw(m1_aP,a,900,a?1700:0);draw(m1_aQ,a,900,a?2700:0);fade(m1_R,a,300,a?3600:0);
    grow(m1_dash,g1.R2,g1.V,a,1200,a?4100:0);
    draw(m1_bis,a,1400,a?5400:0);
  }else{
    fade(b_PQ,a,300,a?1300:0);draw(b_arc0,a,1200);
    if(a)at(1600,()=>setNote(NOTE1));
    draw(m2_aP,a,1200,a?2800:0);draw(m2_aQ,a,1200,a?4100:0);fade(m2_R,a,300,a?5400:0);
    draw(m2_bis,a,1400,a?5900:0);
    grow(m2_dash,g2.V,m2_F,a,900,a?7400:0);
    if(!a)setNote(NOTE1);
  }
}};
const steps=[{run(a){}},{run:simple(defs[0]).run},stepB,{run:simple(defs[2]).run}];
let cur=0;
function render(s,anim){
  cancel();setNote("");
  all.forEach(e=>{e.style.transition="none";e.style.opacity=0;e.style.strokeDasharray=e.tagName==="line"&&(e===m1_dash||e===m2_dash)?"9 6":""});
  for(let i=1;i<=s;i++)steps[i].run(anim&&i===s);
  cur=s;
  $("dots").innerHTML=steps.map((_,i)=>`<i class="${i<=s?"on":""} ${i===s?"cur":""}"></i>`).join("");
  $("bPrev").style.visibility=s===0?"hidden":"visible";
  $("bNext").style.visibility=s===steps.length-1?"hidden":"visible";
  $("bMeth").style.display=(s>=2)?"":"none";
  $("bMeth").textContent=bMethod===1?"2e méthode (angle B)":"1re méthode (angle B)";
}
const next=()=>{if(cur<steps.length-1){if(cur+1===2)bMethod=1;render(cur+1,true)}};
const prev=()=>{if(cur>0)render(cur-1,false)};
$("bNext").onclick=e=>{e.stopPropagation();next()};
$("bPrev").onclick=e=>{e.stopPropagation();prev()};
$("bMeth").onclick=e=>{e.stopPropagation();bMethod=bMethod===1?2:1;
  /* rejoue l'angle B avec l'autre méthode (les angles suivants restent affichés) */
  const keep=cur;cancel();
  all.forEach(x=>{x.style.transition="none";x.style.opacity=0});
  setNote("");
  for(let i=1;i<=keep;i++)steps[i].run(i===2);
  $("bMeth").textContent=bMethod===1?"2e méthode (angle B)":"1re méthode (angle B)";
};
$("fig").onclick=next;
document.addEventListener("keydown",e=>{
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();next()}
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev()}
});
render(0,false);
</script>
